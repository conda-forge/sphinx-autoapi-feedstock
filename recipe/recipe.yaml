schema_version: 1

context:
  name: sphinx-autoapi
  version: "3.8.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/${{ name[0] }}/${{ name }}/${{ name | replace('-', '_') }}-${{ version }}.tar.gz
  sha256: 04643fc50485039294ace8b660d0d1b821a1686824a975725a5106e8cf1fb30b

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . --no-deps -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - flit-core >=3.2,<4
  run:
    - python >=${{ python_min }}
    - astroid >=3.0
    - jinja2
    - pyyaml
    - sphinx >=7.4.0
    - stdlib-list

tests:
  - python:
      imports:
        - autoapi
      pip_check: false
      python_version:
        - ${{ python_min }}
        - "*"

about:
  license: MIT
  license_file: LICENSE.mit
  summary: Sphinx auto API documentation generator
  homepage: http://github.com/rtfd/sphinx-autoapi
  repository: https://github.com/rtfd/sphinx-autoapi
  documentation: http://sphinx-autoapi.readthedocs.io/en/latest/

extra:
  recipe-maintainers:
    - timkpaine
    - honnorat
    - CurtLH
    - ChrisBarker-NOAA
    - bjlittle
